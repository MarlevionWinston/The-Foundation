<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocumenPalindrome Checker</title>

        <!-- add a link to the css file for background color -->
        <link rel="stylesheet" href="Backgroundcolor.css">
</head>
<body>
    <Header>
        <h1>Palindrome Checker</h1>
    </Header>
<Main>
    <form onsubmit="checkPalin(event);">
        <label for="txtWord">Enter a word a phrase:</label>
        <input type="text" id="txtWord">
        <input type="submit" value="Check word">
    </form>

    <div id="divMessage"></div>
<!-- Wel will add an audio element to this div -->
    <div id="divAudio"></div>
<!-- This button adds audio element to the div above -->
     <button id="btnAddAudio" onclick="addAudio()">Add Audio</button>
<!-- 2 buttons to handle the playing of the sound -->
<button id="btnPlayAudio" onclick="playAudio()">Play</button>
<button id="btnPauseAudio" onclick="pauseAudio()">Pause</button>
</Main>
<!-- TODO: move this JavaScript code to an externsl .js file -->
<script src="Code.js"></script> 

</body>
</html>
